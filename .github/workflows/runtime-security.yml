name: Runtime security bundle
on:
  pull_request:
    paths:
      - 'packages/runtime-bundle/**'
      - 'scripts/hosted/**'
      - 'config/Dockerfile.control-panel'
      - '.github/workflows/runtime-security.yml'
  workflow_dispatch:
  push:
    branches: ['codex/tan-834-policy-agent']
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ./packages/runtime-bundle PyYAML==6.0.2 cryptography==44.0.3
      - name: Check out pinned panel consumer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: frumu-ai/tandem
          ref: 3ee2d83d76497565680538ef00f1616f55650524
          path: .test-tandem
      - name: Select panel consumer
        run: |
          test "$(git -C .test-tandem rev-parse HEAD)" = "3ee2d83d76497565680538ef00f1616f55650524"
          echo "TANDEM_TEST_PANEL=$GITHUB_WORKSPACE/.test-tandem/packages/tandem-control-panel" >> "$GITHUB_ENV"
      - name: Shared contract, renderer parity and Linux permissions
        run: |
          for script in scripts/hosted/*.sh; do bash -n "$script"; done
          python -m unittest discover -s packages/runtime-bundle/tests -p 'test_*.py' -v
      - name: Policy service Linux ownership and atomic TLS snapshots
        run: sudo env PYTHONPATH="$GITHUB_WORKSPACE/packages/runtime-bundle" "$(command -v python)" -m unittest discover -s packages/runtime-bundle/tests -p 'test_policy_provision.py' -v
      - name: Verify released v1 engine artifact
        run: |
          mkdir -p "$RUNNER_TEMP/tandem-security-engine"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/tandem-security-engine/engine.tar.gz" https://github.com/frumu-ai/tandem/releases/download/v0.7.2/tandem-engine-enterprise-linux-x64.tar.gz
          echo "a2f9f3da673e23a4dae300698388851b1bf90d2b216567a362245911ba212275  $RUNNER_TEMP/tandem-security-engine/engine.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/tandem-security-engine/engine.tar.gz" -C "$RUNNER_TEMP/tandem-security-engine"
          engine_path="$(find "$RUNNER_TEMP/tandem-security-engine" -type f -name tandem-engine | head -n 1)"
          test -n "$engine_path"
          chmod +x "$engine_path"
          "$engine_path" --version
          echo "TANDEM_TEST_ENGINE=$engine_path" >> "$GITHUB_ENV"
      - name: Real engine startup, denial and durable bound replay
        run: python packages/runtime-bundle/tests/engine_integration.py
      - name: Build the pinned panel container
        run: docker build -f config/Dockerfile.control-panel -t tandem-panel-security-test .
      - name: Run panel with the rendered restrictions
        run: python packages/runtime-bundle/tests/panel_container.py

  policy-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install ./packages/runtime-bundle cryptography==44.0.3
      - name: Resolve exact v2 engine source from the canonical contract
        id: engine-source
        run: python -c 'from tandem_runtime_bundle.policy_contract import POLICY_ENGINE_REVISION; print("revision=" + POLICY_ENGINE_REVISION)' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: frumu-ai/tandem
          ref: ${{ steps.engine-source.outputs.revision }}
          path: .test-policy-engine
      - uses: ./.test-policy-engine/.github/actions/setup-rust-ci
        with:
          cache-profile: hosted-policy-engine
          workspaces: '.test-policy-engine -> target'
      - name: Build the exact enterprise engine for v2 integration
        working-directory: .test-policy-engine
        env:
          EXPECTED_REVISION: ${{ steps.engine-source.outputs.revision }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_REVISION"
          cargo build --locked -p tandem-ai --features enterprise --bin tandem-engine
      - name: Non-root v2 engine with copied authenticated policy agent and real expiry
        run: sudo env TANDEM_TEST_ENGINE="$GITHUB_WORKSPACE/.test-policy-engine/target/debug/tandem-engine" PYTHONPATH="$GITHUB_WORKSPACE/packages/runtime-bundle" "$(command -v python)" packages/runtime-bundle/tests/policy_engine_integration.py
      - name: Non-root engine key overlap, retirement, protected reload and restart
        run: sudo env TANDEM_TEST_ENGINE="$GITHUB_WORKSPACE/.test-policy-engine/target/debug/tandem-engine" PYTHONPATH="$GITHUB_WORKSPACE/packages/runtime-bundle" "$(command -v python)" packages/runtime-bundle/tests/keyring_engine_integration.py
      - name: Actual hosted memory isolation for two users and two customers
        run: sudo env TANDEM_TEST_ENGINE="$GITHUB_WORKSPACE/.test-policy-engine/target/debug/tandem-engine" PYTHONPATH="$GITHUB_WORKSPACE/packages/runtime-bundle" "$(command -v python)" packages/runtime-bundle/tests/memory_engine_integration.py
