name: Publish Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Container tag to publish, for example v0.5.9"
        required: true
        type: string
      tandem_release_version:
        description: "Tandem npm release version to install, for example 0.5.9"
        required: true
        type: string
      runtime_security_version:
        description: "Hosted runtime security contract (v3 builds enterprise engine from pinned source)"
        required: true
        default: '1'
        type: choice
        options: ['1', '3']
      registry:
        description: "Container registry/repository prefix"
        required: true
        default: ghcr.io/frumu-ai/tandem-agents
        type: string
      push_latest:
        description: "Also push latest tags"
        required: true
        default: false
        type: boolean
      register_hosted_release:
        description: "Register a hosted release in Tandem Web after images publish"
        required: true
        default: false
        type: boolean
      tandem_web_base_url:
        description: "Tandem Web base URL used when registering a hosted release"
        required: false
        default: https://tandem.ac
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  IMAGE_REGISTRY: ${{ github.event.inputs.registry || 'ghcr.io/frumu-ai/tandem-agents' }}

jobs:
  resolve:
    name: Resolve Version
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || !endsWith(github.ref_name, '-v3') }}
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      push_latest: ${{ steps.resolve.outputs.push_latest }}
      security_version: ${{ steps.resolve.outputs.security_version }}
      engine_revision: ${{ steps.resolve.outputs.engine_revision }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - id: resolve
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
            version="${{ inputs.tandem_release_version }}"
            push_latest="${{ inputs.push_latest }}"
            security_version="${{ inputs.runtime_security_version }}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            push_latest="false"
            security_version="1"
          fi

          if [[ ! "$tag" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid image tag: $tag" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid Tandem release version: $version" >&2
            exit 1
          fi
          if [[ "$security_version" != "1" && "$security_version" != "3" ]]; then
            echo "Unsupported runtime security version: $security_version" >&2
            exit 1
          fi
          if [[ "$security_version" == "3" ]]; then
            [[ "$tag" == "v${version}-v3" ]] || { echo "v3 images require tag v${version}-v3" >&2; exit 1; }
            [[ "$push_latest" == "false" ]] || { echo "v3 may not replace latest images" >&2; exit 1; }
            engine_revision="$(PYTHONPATH=packages/runtime-bundle python3 -c 'from tandem_runtime_bundle.policy_contract import MEMORY_ENGINE_REVISION; print(MEMORY_ENGINE_REVISION)')"
            [[ "$engine_revision" =~ ^[a-f0-9]{40}$ ]] || exit 1
          else
            engine_revision=""
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "push_latest=$push_latest" >> "$GITHUB_OUTPUT"
          echo "security_version=$security_version" >> "$GITHUB_OUTPUT"
          echo "engine_revision=$engine_revision" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    needs: resolve
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: engine
            dockerfile: config/Dockerfile.engine
            engine_package: "@frumu/tandem"
            latest_alias: engine:latest
          - image: engine-enterprise
            dockerfile: config/Dockerfile.engine
            engine_package: "@frumu/tandem-enterprise"
            latest_alias: engine-enterprise:latest
          - image: aca
            dockerfile: config/Dockerfile
            engine_package: "@frumu/tandem"
            latest_alias: aca:latest
          - image: aca-enterprise
            dockerfile: config/Dockerfile
            engine_package: "@frumu/tandem-enterprise"
            latest_alias: aca-enterprise:latest
          - image: tandem-control-panel
            dockerfile: config/Dockerfile.control-panel
            latest_alias: tandem-control-panel:latest
          - image: tandem-kb-mcp
            dockerfile: config/Dockerfile.kb
            latest_alias: tandem-kb-mcp:latest
          - image: tandem-proxy
            dockerfile: config/Dockerfile.proxy
            latest_alias: tandem-proxy:latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out exact Tandem engine source for v3
        if: ${{ matrix.image == 'engine-enterprise' && needs.resolve.outputs.security_version == '3' }}
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: frumu-ai/tandem
          ref: ${{ needs.resolve.outputs.engine_revision }}
          path: .v3-tandem-source

      - name: Verify exact clean Tandem source for v3
        if: ${{ matrix.image == 'engine-enterprise' && needs.resolve.outputs.security_version == '3' }}
        env:
          EXPECTED_REVISION: ${{ needs.resolve.outputs.engine_revision }}
        run: |
          test "$(git -C .v3-tandem-source rev-parse HEAD)" = "$EXPECTED_REVISION"
          test -z "$(git -C .v3-tandem-source status --porcelain)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build tag list
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "tags<<EOF"
            echo "${IMAGE_REGISTRY}/${{ matrix.image }}:${{ needs.resolve.outputs.tag }}"
            if [[ "${{ needs.resolve.outputs.push_latest }}" == "true" ]]; then
              echo "${IMAGE_REGISTRY}/${{ matrix.latest_alias }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        id: image
        with:
          context: .
          file: ${{ matrix.image == 'engine-enterprise' && needs.resolve.outputs.security_version == '3' && 'config/Dockerfile.engine-v3' || matrix.dockerfile }}
          build-contexts: ${{ matrix.image == 'engine-enterprise' && needs.resolve.outputs.security_version == '3' && 'tandem-source=./.v3-tandem-source' || '' }}
          push: true
          provenance: ${{ matrix.image == 'engine-enterprise' && needs.resolve.outputs.security_version == '3' && 'mode=max' || '' }}
          platforms: linux/amd64
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            TANDEM_RELEASE_VERSION=${{ needs.resolve.outputs.version }}
            TANDEM_ENGINE_RELEASE_VERSION=${{ needs.resolve.outputs.version }}
            TANDEM_CONTROL_PANEL_RELEASE_VERSION=${{ needs.resolve.outputs.version }}
            TANDEM_ENGINE_PACKAGE=${{ matrix.engine_package || '@frumu/tandem' }}
            TANDEM_ENGINE_SOURCE_REVISION=${{ needs.resolve.outputs.engine_revision }}
            VERSION=${{ needs.resolve.outputs.tag }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.head_commit.timestamp || github.event.repository.updated_at }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      - name: Record immutable image digest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          mkdir -p image-digests
          printf '%s' "$IMAGE_DIGEST" > "image-digests/$IMAGE_NAME"

      - name: Verify published v3 binary and record source/image observation
        if: ${{ matrix.image == 'engine-enterprise' && needs.resolve.outputs.security_version == '3' }}
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          SOURCE_REVISION: ${{ needs.resolve.outputs.engine_revision }}
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          image_ref="${IMAGE_REGISTRY}/engine-enterprise@${IMAGE_DIGEST}"
          docker pull "$image_ref"
          test "$(docker run --rm --entrypoint cat "$image_ref" /usr/share/tandem/engine-source-revision)" = "$SOURCE_REVISION"
          recorded="$(docker run --rm --entrypoint cat "$image_ref" /usr/share/tandem/engine-binary.sha256)"
          actual="$(docker run --rm --entrypoint sha256sum "$image_ref" /home/node/npm/bin/tandem-engine | cut -d' ' -f1)"
          [[ "$actual" =~ ^[a-f0-9]{64}$ ]]
          test "$actual" = "$recorded"
          docker run --rm --entrypoint /home/node/npm/bin/tandem-engine "$image_ref" --version
          mkdir -p engine-attestation
          PYTHONPATH=packages/runtime-bundle python3 -m tandem_runtime_bundle.engine_image_attestation \
            --image-ref "$image_ref" --source-revision "$SOURCE_REVISION" \
            --binary-sha256 "$actual" --builder-revision "$GITHUB_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID" \
            --output engine-attestation/engine-image-attestation.json \
            > engine-attestation/engine-image-attestation.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: hosted-image-digest-${{ matrix.image }}
          path: image-digests/

      - uses: actions/upload-artifact@v4
        if: ${{ matrix.image == 'engine-enterprise' && needs.resolve.outputs.security_version == '3' }}
        with:
          name: hosted-engine-v3-attestation
          path: engine-attestation/


  register-hosted-release:
    name: Register Hosted Release
    runs-on: ubuntu-latest
    needs:
      - resolve
      - publish
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.register_hosted_release }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          pattern: hosted-image-digest-*
          merge-multiple: true
          path: image-digests
      - uses: actions/download-artifact@v4
        if: ${{ needs.resolve.outputs.security_version == '3' }}
        with:
          name: hosted-engine-v3-attestation
          path: engine-attestation
      - name: Prepare pinned hosted release inputs
        shell: bash
        env:
          IMAGE_REGISTRY: ${{ env.IMAGE_REGISTRY }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
          SECURITY_VERSION: ${{ needs.resolve.outputs.security_version }}
          ENGINE_REVISION: ${{ needs.resolve.outputs.engine_revision }}
        run: |
          set -euo pipefail
          test "$RELEASE_VERSION" = "0.7.2" || { echo "Runtime security contract requires tested engine version 0.7.2" >&2; exit 1; }
          for image in engine-enterprise aca-enterprise tandem-control-panel tandem-proxy tandem-kb-mcp; do
            digest="$(cat "image-digests/$image")"
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]] || exit 1
          done
          {
            echo "HOSTED_ALLOW_RELEASE_OVERRIDE=true"
            echo "HOSTED_RUNTIME_SECURITY_VERSION=$SECURITY_VERSION"
            echo "HOSTED_RELEASE_VERSION=$RELEASE_VERSION"
            echo "HOSTED_RELEASE_TAG=$([[ "$SECURITY_VERSION" == '3' ]] && printf '%s' "$RELEASE_TAG" || printf '%s' "$RELEASE_VERSION")"
            echo "HOSTED_TANDEM_ENGINE_RELEASE_VERSION=$RELEASE_VERSION"
            echo "HOSTED_TANDEM_CONTROL_PANEL_RELEASE_VERSION=$RELEASE_VERSION"
            echo "HOSTED_TANDEM_ENGINE_SOURCE_REVISION=$ENGINE_REVISION"
            echo "HOSTED_ENGINE_IMAGE=$IMAGE_REGISTRY/engine-enterprise@$(cat image-digests/engine-enterprise)"
            echo "HOSTED_ACA_IMAGE=$IMAGE_REGISTRY/aca-enterprise@$(cat image-digests/aca-enterprise)"
            echo "HOSTED_CONTROL_PANEL_IMAGE=$IMAGE_REGISTRY/tandem-control-panel@$(cat image-digests/tandem-control-panel)"
            echo "HOSTED_PROXY_IMAGE=$IMAGE_REGISTRY/tandem-proxy@$(cat image-digests/tandem-proxy)"
            echo "HOSTED_KB_IMAGE=$IMAGE_REGISTRY/tandem-kb-mcp@$(cat image-digests/tandem-kb-mcp)"
          } >> "$GITHUB_ENV"
          if [[ "$SECURITY_VERSION" == "3" ]]; then
            test -f engine-attestation/engine-image-attestation.json
            image_ref="$IMAGE_REGISTRY/engine-enterprise@$(cat image-digests/engine-enterprise)"
            PYTHONPATH=packages/runtime-bundle python3 - "$image_ref" "$ENGINE_REVISION" <<'PY' >> "$GITHUB_ENV"
          import sys
          from pathlib import Path
          from tandem_runtime_bundle.engine_image_attestation import load_attestation
          document, digest = load_attestation(
              "engine-attestation/engine-image-attestation.json", sys.argv[1], sys.argv[2])
          if Path("engine-attestation/engine-image-attestation.sha256").read_text().strip() != digest:
              raise SystemExit("v3 engine attestation fingerprint mismatch")
          print("HOSTED_ENGINE_BINARY_SHA256=" + document["engine_binary_sha256"])
          print("HOSTED_ENGINE_ATTESTATION_SHA256=" + digest)
          print("HOSTED_ENGINE_ATTESTATION_FILE=engine-attestation/engine-image-attestation.json")
          PY
          fi

      - name: Register release in Tandem Web
        shell: bash
        env:
          TANDEM_WEB_BASE_URL: ${{ inputs.tandem_web_base_url }}
          HOSTED_RELEASE_PUBLISH_TOKEN: ${{ secrets.TANDEM_WEB_HOSTED_RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$HOSTED_RELEASE_PUBLISH_TOKEN" ]]; then
            echo "Missing TANDEM_WEB_HOSTED_RELEASE_PUBLISH_TOKEN secret." >&2
            exit 1
          fi

          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          # This calls the code-owned v3 image allowlist and verifies the exact
          # attestation file. Until a repaired engine digest is approved, it fails.
          scripts/hosted/release-payload.sh --channel stable --published true > "$payload"

          curl -fsS \
            -X POST "${TANDEM_WEB_BASE_URL%/}/api/v1/internal/hosted/releases" \
            -H "Authorization: Bearer ${HOSTED_RELEASE_PUBLISH_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary "@${payload}"
